name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulate:
    name: tests + tap simulations + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the pipeline gate
        run: ./scripts/pipeline.sh

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
